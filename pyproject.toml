[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage"
version = "0.1.0"
description = "Local token usage reports for OpenAI Codex CLI/Desktop sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "codex-usage contributors" }
]
keywords = ["codex", "openai", "tokens", "usage", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
codex-usage = "codex_usage:main"

[tool.setuptools]
py-modules = ["codex_usage"]
